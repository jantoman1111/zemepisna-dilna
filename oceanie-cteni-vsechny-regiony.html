<!DOCTYPE html>
<html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oceánie – Čtení s porozuměním | Zeměpisná dílna</title>
<style>:root{--navy:#16497a;--ink:#1f2937;--muted:#64748b;--line:#e2e8f0;--ok:#2f9e57;--bad:#e2564f;--gold:#f5b942}
*{box-sizing:border-box}
body{font-family:'Segoe UI',Verdana,Arial,sans-serif;margin:0;background:#f6f8fb;color:var(--ink)}
header.top{background:linear-gradient(135deg,var(--navy),#1f6aa8);color:#fff;padding:22px 16px 18px;text-align:center}
header.top h1{margin:0 0 4px;font-size:clamp(1.3rem,4.5vw,1.9rem)}
header.top p{margin:0;font-size:.95rem;color:#d3e6f8}
.wrap{max-width:1200px;margin:0 auto;padding:14px}
.maprow{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:14px;align-items:start}
@media(max-width:860px){.maprow{grid-template-columns:1fr}}
.mapbox{background:#cfe7f7;border-radius:16px;border:2px solid #b5d4ea;overflow:hidden;position:relative}
.mapbox svg{width:100%;height:auto;display:block}
.cn0{fill:#e9edf2;stroke:#fff;stroke-width:.5}
.cn1{stroke:#fff;stroke-width:.7;cursor:pointer;transition:filter .15s,fill .2s}
.cn1:hover{filter:brightness(1.12)}
.cn1.sel,.dot.sel{stroke:#16497a;stroke-width:2.2}
.dot{stroke:#fff;stroke-width:1.4;cursor:pointer}
.dot:hover{filter:brightness(1.15)}
.cn1.good{fill:#3fb36b!important}.cn1.bad{fill:#e2564f!important}.dot.good{fill:#3fb36b!important}.dot.bad{fill:#e2564f!important}
.lbl{font:600 11px 'Segoe UI',sans-serif;fill:#16497a;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:3px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(20,40,80,.06)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.78rem;color:var(--muted);margin:10px 2px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.btn{font:600 .95rem 'Segoe UI',sans-serif;border:0;border-radius:12px;padding:10px 18px;background:var(--navy);color:#fff;cursor:pointer}
.btn.alt{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn:hover{filter:brightness(1.1)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font:600 .8rem 'Segoe UI',sans-serif;padding:6px 11px;border-radius:99px;border:1.5px solid var(--c,#94a3b8);background:#fff;color:#334155;cursor:pointer}
.chip:hover,.chip.sel{background:var(--c,#94a3b8);color:#fff}

.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.tab{font:700 .92rem 'Segoe UI',sans-serif;padding:9px 16px;border-radius:99px;border:2.5px solid var(--c);background:#fff;color:var(--c);cursor:pointer}.tab.on{background:var(--c);color:#fff}
.txt{background:#fff;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:16px 20px;line-height:1.7;font-size:1.02rem}
.txt h2{margin:0 0 8px;color:var(--c)}.txt p{margin:0 0 10px}
.hl{background:#fff8e6;border-left:4px solid var(--gold);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:.95rem}
.qs{margin-top:16px;display:grid;gap:12px}
.qc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.qc .cat{font-size:.7rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.qc p{margin:3px 0 8px;font-weight:700}
.os{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:620px){.os{grid-template-columns:1fr}}
.o{font:600 .95rem 'Segoe UI',sans-serif;text-align:left;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}.o:hover{border-color:var(--navy)}
.o.good{background:#dff5e6;border-color:var(--ok)}.o.bad{background:#fde6e4;border-color:var(--bad)}.o:disabled{cursor:default}
.ex{display:none;margin-top:8px;font-size:.9rem;color:#334155}.ex.show{display:block}
.score{position:sticky;bottom:0;background:#fff;border-top:2px solid var(--line);padding:10px;text-align:center;font-weight:800;color:var(--navy);margin-top:14px;border-radius:12px 12px 0 0}
</style></head><body>

<script>
const D=[{"key": "aus", "name": "Austrálie", "color": "#2f7fb0", "text": ["Austrálie je jediný stát na světě, který zabírá celý světadíl. S rozlohou téměř 7,7 milionu km² je šestou největší zemí světa, ale žije v ní jen asi 26 milionů lidí. Většina z nich bydlí na úrodném pobřeží, zejména na jihovýchodě, kde leží velká města Sydney a Melbourne. Hlavním městem je ale menší Canberra, kterou postavili jako kompromis mezi oběma soupeřícími městy.", "Vnitrozemí se říká outback. Je suché, rudé a řídce osídlené a leží tam poušť i posvátná skála Uluru. Na východě se táhne pohoří Velké předělové a na severovýchodě leží největší korálový útes světa, Velký bariérový útes. Austrálie je od ostatních světadílů dlouho oddělená, proto tu žijí živočichové, které jinde nenajdeš, třeba klokani, koaly nebo ptakopysk.", "Původními obyvateli jsou Aboriginci, kteří tu žijí asi 60 000 let. Kolonizace Evropany začala koncem 18. století a dnes je oficiálním jazykem angličtina."], "fun": "Na světě žije v Austrálii víc klokanů než lidí, odhadem kolem 40 milionů.", "q": [{"cat": "Poloha", "q": "Kolik světadílů zabírá stát Austrálie?", "o": ["žádný", "jeden celý", "dva", "polovinu světadílu"], "a": 1, "e": "Austrálie zabírá celý světadíl."}, {"cat": "Města", "q": "Které město je hlavním městem Austrálie?", "o": ["Sydney", "Canberra", "Melbourne", "Perth"], "a": 1, "e": "Canberra vznikla jako kompromis mezi Sydney a Melbourne."}, {"cat": "Obyvatelstvo", "q": "Kde bydlí většina Australanů?", "o": ["v poušti", "na pobřeží", "v horách", "na ostrovech"], "a": 1, "e": "Vnitrozemí je suché a řídce osídlené."}, {"cat": "Příroda", "q": "Jak se jmenuje suché vnitrozemí Austrálie?", "o": ["tundra", "outback", "prérie", "savana"], "a": 1, "e": "Outback je rudá a suchá krajina vnitrozemí."}, {"cat": "Příroda", "q": "Kde leží největší korálový útes světa?", "o": ["u Nového Zélandu", "u severovýchodu Austrálie", "u Fidži", "u Havaje"], "a": 1, "e": "Velký bariérový útes leží u pobřeží Queenslandu."}, {"cat": "Příroda", "q": "Proč v Austrálii žijí unikátní živočichové?", "o": ["je tam hodně lesů", "byla dlouho oddělená od ostatních světadílů", "je tam chladné podnebí", "je největší na světě"], "a": 1, "e": "Izolace umožnila vznik endemických druhů."}, {"cat": "Obyvatelstvo", "q": "Jak se jmenují původní obyvatelé Austrálie?", "o": ["Maorové", "Aboriginci", "Inuité", "Indiáni"], "a": 1, "e": "Aboriginci tu žijí desítky tisíc let."}, {"cat": "Poloha", "q": "Na které polokouli leží Austrálie?", "o": ["severní", "jižní", "východní i západní, ale ne jižní", "v Arktidě"], "a": 1, "e": "Leží na jižní polokouli, proto je tam v prosinci léto."}]}, {"key": "nz", "name": "Nový Zéland", "color": "#3d8c40", "text": ["Nový Zéland leží v jihozápadním Pacifiku asi 2 000 km východně od Austrálie. Tvoří ho dva hlavní ostrovy, Severní a Jižní, a mnoho menších. Hlavním městem je Wellington, největším městem Auckland. Žije tu asi 5 milionů lidí a dohromady víc ovcí než obyvatel.", "Příroda je velmi rozmanitá. Jižním ostrovem se táhnou Jižní Alpy s nejvyšší horou Aoraki (Mount Cook, 3 724 m), kde najdeš ledovce i fjordy. Severní ostrov je sopečný, jsou tu horké prameny a gejzíry, třeba u města Rotorua. Nový Zéland leží na rozhraní dvou litosférických desek, a tak ho často zasahují zemětřesení.", "Původními obyvateli jsou Maorové, kteří přišli na kánoích z Polynésie. Úředními jazyky jsou angličtina a maorština. Symbolem země je nelétavý pták kiwi a země se proslavila i filmovou trilogií Pán prstenů."], "fun": "Přezdívka „Kiwi“ se používá i pro obyvatele Nového Zélandu, ne jen pro ptáka.", "q": [{"cat": "Poloha", "q": "Z kolika hlavních ostrovů se Nový Zéland skládá?", "o": ["z jednoho", "ze dvou", "ze tří", "ze čtyř"], "a": 1, "e": "Je to Severní a Jižní ostrov."}, {"cat": "Města", "q": "Které město je hlavním městem Nového Zélandu?", "o": ["Auckland", "Christchurch", "Wellington", "Queenstown"], "a": 2, "e": "Největší je Auckland, hlavní město je Wellington."}, {"cat": "Příroda", "q": "Jak se jmenují hory na Jižním ostrově?", "o": ["Skalnaté hory", "Jižní Alpy", "Andy", "Himálaj"], "a": 1, "e": "Nejvyšší horou je Aoraki (Mount Cook)."}, {"cat": "Příroda", "q": "Co najdeš u města Rotorua?", "o": ["pouště", "gejzíry a horké prameny", "tropický prales", "polární záři"], "a": 1, "e": "Severní ostrov je sopečně aktivní."}, {"cat": "Příroda", "q": "Proč se na Novém Zélandu často třese země?", "o": ["kvůli větru", "leží na rozhraní litosférických desek", "kvůli moři", "kvůli těžbě"], "a": 1, "e": "Desky se tu posouvají a způsobují zemětřesení."}, {"cat": "Obyvatelstvo", "q": "Jak se jmenují původní obyvatelé Nového Zélandu?", "o": ["Aboriginci", "Maorové", "Inkové", "Samojci"], "a": 1, "e": "Maorové přišli z Polynésie."}, {"cat": "Hospodářství", "q": "Čeho je na Novém Zélandu víc než obyvatel?", "o": ["aut", "ovcí", "hor", "jezer"], "a": 1, "e": "Ovcí je asi několikanásobně víc než lidí."}, {"cat": "Symboly", "q": "Jaký pták je symbolem Nového Zélandu?", "o": ["emu", "kiwi", "tučňák", "papoušek"], "a": 1, "e": "Kiwi je nelétavý pták."}]}, {"key": "mel", "name": "Melanésie", "color": "#d9783a", "text": ["Název Melanésie znamená „černé ostrovy“. Leží v jihozápadním Pacifiku severovýchodně od Austrálie. Patří sem Papua-Nová Guinea, Šalamounovy ostrovy, Vanuatu a Fidži. Ostrovy jsou často hornaté, porostlé tropickým deštným lesem a mnohé z nich vznikly sopečnou činností.", "Největším státem je Papua-Nová Guinea, která leží na východní polovině ostrova Nová Guinea. Je to neuvěřitelně pestrá země, kde se mluví více než 800 jazyky, nejvíc na světě. Hlavním městem je Port Moresby. Fidži má přes 330 ostrovů a patří mezi oblíbené turistické cíle s korálovými plážemi.", "Obyvatelé žijí tradičně ze zemědělství a rybolovu. Pěstují batáty, taro, kokosové ořechy a kávu. Mnoho vesnic je dostupných jen lodí nebo letadlem."], "fun": "Na ostrově Pentecost ve Vanuatu skáčou muži z věží s liánami uvázanými na kotnících. Z tohoto rituálu vznikl bungee jumping.", "q": [{"cat": "Název", "q": "Co znamená název Melanésie?", "o": ["malé ostrovy", "černé ostrovy", "mnoho ostrovů", "jižní ostrovy"], "a": 1, "e": "Řecky melas = černý."}, {"cat": "Státy", "q": "Který stát patří do Melanésie?", "o": ["Samoa", "Fidži", "Tonga", "Palau"], "a": 1, "e": "Fidži je melanéský stát."}, {"cat": "Státy", "q": "Které je největší stát Melanésie?", "o": ["Vanuatu", "Papua-Nová Guinea", "Fidži", "Šalamounovy ostrovy"], "a": 1, "e": "Papua-Nová Guinea má největší rozlohu i počet obyvatel."}, {"cat": "Města", "q": "Jaké je hlavní město Papuy-Nové Guineje?", "o": ["Port Moresby", "Suva", "Honiara", "Port Vila"], "a": 0, "e": "Suva je hlavní město Fidži."}, {"cat": "Obyvatelstvo", "q": "Čím je Papua-Nová Guinea výjimečná?", "o": ["má nejvíc sopek", "mluví se tam přes 800 jazyky", "nemá pobřeží", "leží v Evropě"], "a": 1, "e": "Je to země s největší jazykovou rozmanitostí."}, {"cat": "Příroda", "q": "Jaký typ lesa tu převažuje?", "o": ["tajga", "tropický deštný les", "opadavý les", "listnatý les mírného pásu"], "a": 1, "e": "Vlhké tropické podnebí podporuje deštné lesy."}, {"cat": "Hospodářství", "q": "Co obyvatelé tradičně pěstují?", "o": ["pšenici a řepu", "batáty, taro a kokos", "brambory", "olivy"], "a": 1, "e": "Typické tropické plodiny."}, {"cat": "Zajímavosti", "q": "Který rituál z Vanuatu inspiroval sport?", "o": ["surfing", "bungee jumping", "lyžování", "potápění"], "a": 1, "e": "Land diving na ostrově Pentecost."}]}, {"key": "mik", "name": "Mikronésie", "color": "#8e5bd0", "text": ["Název Mikronésie znamená „malé ostrovy“. Rozkládá se v západním Pacifiku severně od rovníku a tvoří ji tisíce drobných ostrůvků. Patří sem státy Kiribati, Mikronésie, Marshallovy ostrovy, Palau a Nauru. Většina ostrovů jsou korálové atoly, tedy prstence ostrůvků kolem mělké laguny.", "Atoly jsou velmi nízké, často jen pár metrů nad mořem, takže jim hrozí zatopení kvůli stoupající hladině oceánu. Hlavním zdrojem obživy je rybolov, kokosové ořechy a v poslední době také turistika, například potápění v Palau.", "Nauru je nejmenším ostrovním státem světa. Kdysi bylo bohaté těžbou fosfátů, ale ty se vytěžily. Na Marshallových ostrovech leží atol Bikini, kde USA v 50. letech zkoušely atomové bomby."], "fun": "Kiribati je jediný stát světa, který leží na všech čtyřech polokoulích, protože ho protíná rovník i 180. poledník.", "q": [{"cat": "Název", "q": "Co znamená název Mikronésie?", "o": ["černé ostrovy", "malé ostrovy", "mnoho ostrovů", "velké ostrovy"], "a": 1, "e": "Řecky mikros = malý."}, {"cat": "Státy", "q": "Který stát patří do Mikronésie?", "o": ["Fidži", "Palau", "Tonga", "Vanuatu"], "a": 1, "e": "Palau je mikronéský stát."}, {"cat": "Příroda", "q": "Co je atol?", "o": ["sopka", "korálový prstenec kolem laguny", "pohoří", "ledovec"], "a": 1, "e": "Atol je typický korálový ostrov."}, {"cat": "Příroda", "q": "Čím jsou atoly ohroženy?", "o": ["mrazy", "stoupající hladinou moře", "pouštěmi", "lavinami"], "a": 1, "e": "Jsou jen pár metrů nad mořem."}, {"cat": "Státy", "q": "Který stát je nejmenším ostrovním státem světa?", "o": ["Nauru", "Kiribati", "Palau", "Tuvalu"], "a": 0, "e": "Nauru má jen 21 km²."}, {"cat": "Dějiny", "q": "Co se zkoušelo na atolu Bikini?", "o": ["rakety", "atomové bomby", "lodě", "letadla"], "a": 1, "e": "USA tam zkoušely atomové zbraně."}, {"cat": "Hospodářství", "q": "Z čeho Nauru dříve bohatlo?", "o": ["z ropy", "z těžby fosfátů", "z kávy", "z diamantů"], "a": 1, "e": "Fosfáty se vytěžily a zbyla zdevastovaná krajina."}, {"cat": "Zajímavosti", "q": "Proč leží Kiribati na všech čtyřech polokoulích?", "o": ["má hodně ostrovů na zemi", "protíná ho rovník i 180. poledník", "je největší", "leží na pólu"], "a": 1, "e": "Souostroví je rozložené přes rovník i poledník."}]}, {"key": "pol", "name": "Polynésie", "color": "#2f8fd0", "text": ["Název Polynésie znamená „mnoho ostrovů“. Je to největší část ostrovní Oceánie a leží v centrální a východní části Tichého oceánu. Tvoří ji pomyslný trojúhelník s vrcholy na Havaji, na Novém Zélandu a na Velikonočním ostrově. Patří sem státy Samoa, Tonga a Tuvalu, ale také území jako Francouzská Polynésie s ostrovem Tahiti a Havaj, která je státem USA.", "Obyvatelé Polynésie byli vynikající námořníci. Na velkých dvojitých kánoích se plavili tisíce kilometrů bez kompasu, jen podle hvězd, vln a letu ptáků. Tak osídlili ostrovy od Samoy po Nový Zéland.", "Velikonoční ostrov, který patří Chile, je proslavený obřími kamennými sochami moai. Dnes polynéské státy žijí z rybolovu, zemědělství a turistiky. Tuvalu i další nízké ostrovy ohrožuje stoupající hladina moře."], "fun": "Samoa je jedním z prvních států, kde nový den začíná. V roce 2011 přeskočilo celé datum, aby bylo blíž obchodním partnerům v Austrálii.", "q": [{"cat": "Název", "q": "Co znamená název Polynésie?", "o": ["malé ostrovy", "mnoho ostrovů", "černé ostrovy", "studené ostrovy"], "a": 1, "e": "Řecky poly = mnoho."}, {"cat": "Poloha", "q": "Který ostrov tvoří vrchol polynéského trojúhelníku?", "o": ["Madagaskar", "Velikonoční ostrov", "Island", "Borneo"], "a": 1, "e": "Další vrcholy jsou Havaj a Nový Zéland."}, {"cat": "Státy", "q": "Který stát patří do Polynésie?", "o": ["Samoa", "Papua-Nová Guinea", "Palau", "Nauru"], "a": 0, "e": "Samoa leží v centrální Polynésii."}, {"cat": "Dějiny", "q": "Podle čeho se plavili staří Polynésané?", "o": ["podle kompasu", "podle hvězd, vln a ptáků", "podle map", "podle sonaru"], "a": 1, "e": "Byli mistři navigace bez přístrojů."}, {"cat": "Zajímavosti", "q": "Čím je proslavený Velikonoční ostrov?", "o": ["gejzíry", "sochami moai", "korálovým útesem", "sopkou Fudži"], "a": 1, "e": "Moai jsou obří kamenné sochy."}, {"cat": "Státy", "q": "Komu patří Velikonoční ostrov?", "o": ["Austrálii", "Chile", "Japonsku", "Francii"], "a": 1, "e": "Je součástí Chile."}, {"cat": "Příroda", "q": "Čím je ohroženo Tuvalu?", "o": ["pouští", "zatopením mořem", "mrazem", "sopkami"], "a": 1, "e": "Je velmi nízko nad mořem."}, {"cat": "Zajímavosti", "q": "Co se stalo se Samoou v roce 2011?", "o": ["změnilo vlajku", "přeskočilo jeden den v kalendáři", "zrušilo moře", "získalo ostrov"], "a": 1, "e": "Přesunula se na druhou stranu datové hranice."}]}];
const st={};D.forEach(r=>st[r.key]={a:{},ok:0});
let cur=D[0].key;
const $=id=>document.getElementById(id);
function tabs(){$('tabs').innerHTML=D.map(r=>'<button class="tab'+(r.key===cur?' on':'')+'" style="--c:'+r.color+'" data-k="'+r.key+'">'+r.name+'</button>').join('')}
function show(){const r=D.find(x=>x.key===cur);const s=st[r.key];
 $('body').style.setProperty('--c',r.color);
 $('body').innerHTML='<div class="txt" style="--c:'+r.color+'"><h2>'+r.name+'</h2>'+r.text.map(t=>'<p>'+t+'</p>').join('')+'<div class="hl">💡 '+r.fun+'</div></div><div class="qs">'+
 r.q.map((q,i)=>'<div class="qc"><div class="cat">'+q.cat+' · otázka '+(i+1)+'</div><p>'+q.q+'</p><div class="os">'+q.o.map((o,j)=>'<button class="o" data-i="'+i+'" data-j="'+j+'">'+'ABCD'[j]+') '+o+'</button>').join('')+'</div><div class="ex" id="ex'+i+'">'+q.e+'</div></div>').join('')+'</div>';
