<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Atlas krajů — Česká republika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#EFE6D2;
    --parchment-dark:#E4D8BC;
    --ink:#2B2418;
    --ink-soft:#5B5240;
    --forest:#3C5B45;
    --forest-dark:#2A4232;
    --rust:#B5533C;
    --gold:#B08A32;
    --line:#8A7A55;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.35), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(0,0,0,0.06), transparent 55%),
      var(--parchment);
    color:var(--ink);
    font-family:'Source Sans 3', sans-serif;
    min-height:100vh;
  }
  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    border-bottom:2px solid var(--line);
    padding-bottom:16px;
    margin-bottom:26px;
    flex-wrap:wrap;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(28px,4vw,42px);
    margin:0;
    letter-spacing:0.3px;
    color:var(--forest-dark);
  }
  h1 span{color:var(--rust);}
  .subtitle{
    margin:6px 0 0;
    font-size:15px;
    color:var(--ink-soft);
    font-style:italic;
  }
  .compass{ width:56px; height:56px; opacity:0.75; flex-shrink:0; }

  .layout{
    display:grid;
    grid-template-columns:minmax(320px,620px) minmax(300px,1fr);
    gap:28px;
    align-items:start;
  }
  @media (max-width:860px){
    .layout{grid-template-columns:1fr;}
  }

  .map-card{
    background:rgba(255,255,255,0.35);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px;
    position:relative;
  }
  .map-card::before{
    content:"";
    position:absolute; inset:6px;
    border:1px dashed rgba(138,122,85,0.55);
    border-radius:4px;
    pointer-events:none;
  }
  svg#map{ width:100%; height:auto; display:block; }

  .hex{
    fill:var(--forest);
    stroke:var(--parchment);
    stroke-width:2.5;
    cursor:pointer;
    transition:fill .15s ease, transform .15s ease;
    transform-origin:center;
  }
  .hex:hover{ fill:#4E7157; }
  .hex.active{ fill:var(--rust); }
  .hex-praha{
    fill:var(--gold);
    stroke:var(--parchment);
    stroke-width:2;
    cursor:pointer;
    transition:fill .15s ease;
  }
  .hex-praha:hover{ fill:#C79B3D; }
  .hex-praha.active{ fill:var(--rust); }

  .hexlabel{
    font-family:'Source Sans 3', sans-serif;
    font-size:10.5px;
    font-weight:600;
    fill:var(--parchment);
    pointer-events:none;
    text-anchor:middle;
  }
  .hexlabel.small{ font-size:8px; fill:var(--ink); }

  .legend{
    margin-top:10px;
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
  }

  /* Detail panel */
  .panel{
    background:#FBF7EC;
    border:1px solid var(--line);
    border-radius:6px;
    padding:26px 26px 22px;
    min-height:520px;
  }
  .panel-empty{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; height:100%; min-height:470px; color:var(--ink-soft);
  }
  .panel-empty svg{ width:64px; height:64px; margin-bottom:14px; opacity:0.5; }
  .panel-empty p{ max-width:280px; line-height:1.5; }

  .region-eyebrow{
    font-size:12px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--gold); font-weight:600; margin:0 0 4px;
  }
  .region-title{
    font-family:'Fraunces', serif; font-weight:700; font-size:30px;
    margin:0 0 2px; color:var(--forest-dark);
  }
  .region-capital{ font-size:14.5px; color:var(--ink-soft); margin:0 0 18px; }

  .stat-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px 16px;
    padding:14px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    margin-bottom:18px;
  }
  .stat{ }
  .stat .k{ font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-soft); margin-bottom:2px;}
  .stat .v{ font-size:15px; font-weight:600; color:var(--ink); }

  .section{ margin-bottom:16px; }
  .section h3{
    font-family:'Fraunces', serif; font-size:15px; font-weight:600;
    color:var(--forest-dark); margin:0 0 6px;
    display:flex; align-items:center; gap:7px;
  }
  .section h3::before{
    content:""; width:7px; height:7px; background:var(--rust); border-radius:50%; display:inline-block;
  }
  .section p, .section li{ font-size:14.5px; line-height:1.55; color:var(--ink); margin:0; }
  .section ul{ margin:2px 0 0; padding-left:18px; }
  .funfact{
    background:var(--parchment-dark);
    border-left:3px solid var(--rust);
    padding:12px 14px; border-radius:0 4px 4px 0;
    font-size:14px; font-style:italic; color:var(--ink-soft);
  }

  .close-btn{
    display:none;
  }
  @media (max-width:860px){
    .panel{ min-height:auto; }
  }
</style>
</head>

    </div>

  <div class="layout">
    <div class="map-card">

    </div>

    <div class="panel" id="panel">
      <div class="panel-empty" id="panelEmpty">

      </div>
      <div id="panelContent" style="display:none;"></div>
    </div>
  </div>
</div>

    name: "Královéhradecký kraj", capital: "Hradec Králové",
    area: "4 759 km²", population: "≈ 550 tisíc", districts: "5 okresů",

    fact: "Na Sněžce, nejvyšší hoře Česka, stojí kaple a část vrcholu leží na polském území."

  pardubicky: {
    name: "Pardubický kraj", capital: "Pardubice",
    area: "4 519 km²", population: "≈ 520 tisíc", districts: "4 okresy",
    highest: "Buková hora, 958 m (Orlické hory)", rivers: "Labe, Chrudimka",
    neighbors: "Sousedí s Polskem", cities: "Pardubice, Chrudim, Svitavy, Ústí nad Orlicí",
    economy: "Chemický průmysl (Synthesia), strojírenství, automobilové součástky.",
    attractions: "Zámek Kunětická hora, historické centrum Litomyšle (UNESCO), Orlické hory.",

    area: "6 796 km²", population: "≈ 505 tisíc", districts: "5 okresů",
    highest: "Javořice, 837 m", rivers: "Sázava, Svratka, Jihlava",
    neighbors: "Leží ve středu ČR mezi Čechami a Moravou", cities: "Jihlava, Třebíč, Žďár nad Sázavou, Havlíčkův Brod",

    neighbors: "Sousedí s Rakouskem a Slovenskem", cities: "Brno, Znojmo, Hodonín, Břeclav",
    economy: "IT a výzkum (univerzity a technologické firmy v Brně), vinařství, strojírenství.",
    attractions: "Hrad Špilberk v Brně, Lednicko-valtický areál (UNESCO), jeskyně Moravského krasu.",

  olomoucky: {
    name: "Olomoucký kraj", capital: "Olomouc",

// Hex grid layout (pointy-top hexagons)
const size = 62;
const w = Math.sqrt(3) * size;
const rowSpacing = 0.75*2*size;
const rowA_y = 95, rowB_y = 95 + rowSpacing, rowC_y = 95 + 2*rowSpacing;
const rowA_x0 = 95, rowB_x0 = 95 + w/2, rowC_x0 = 95 + w/2;

function hexPoints(cx, cy, r){
  const pts = [];
  for(let i=0;i<6;i++){
    const angle = Math.PI/180 * (60*i - 30);
    pts.push([cx + r*Math.cos(angle), cy + r*Math.sin(angle)]);
  }
  return pts.map(p=>p.join(",")).join(" ");
}

const layout = [
  // row A (north)
  {id:"karlovarsky", cx: rowA_x0 + 0*w, cy: rowA_y, label:"Karlovarský"},
  {id:"ustecky", cx: rowA_x0 + 1*w, cy: rowA_y, label:"Ústecký"},
  {id:"liberecky", cx: rowA_x0 + 2*w, cy: rowA_y, label:"Liberecký"},
  {id:"kralovehradecky", cx: rowA_x0 + 3*w, cy: rowA_y, label:"Královéhradecký"},
  {id:"moravskoslezsky", cx: rowA_x0 + 4*w, cy: rowA_y, label:"Moravsko-\nslezský"},
  // row B (middle)
  {id:"plzensky", cx: rowB_x0 + 0*w, cy: rowB_y, label:"Plzeňský"},
  {id:"stredocesky", cx: rowB_x0 + 1*w, cy: rowB_y, label:"Středočeský"},
  {id:"pardubicky", cx: rowB_x0 + 2*w, cy: rowB_y, label:"Pardubický"},
  {id:"olomoucky", cx: rowB_x0 + 3*w, cy: rowB_y, label:"Olomoucký"},
  // row C (south)
  {id:"jihocesky", cx: rowC_x0 + 0*w, cy: rowC_y, label:"Jihočeský"},
  {id:"vysocina", cx: rowC_x0 + 1*w, cy: rowC_y, label:"Vysočina"},
  {id:"jihomoravsky", cx: rowC_x0 + 2*w, cy: rowC_y, label:"Jihomoravský"},
  {id:"zlinsky", cx: rowC_x0 + 3*w, cy: rowC_y, label:"Zlínský"},
];

const svg = document.getElementById("map");
const NS = "http://www.w3.org/2000/svg";

layout.forEach(item=>{
  const poly = document.createElementNS(NS,"polygon");
  poly.setAttribute("points", hexPoints(item.cx, item.cy, size-4));
  poly.setAttribute("class","hex");
  poly.setAttribute("data-id", item.id);
  poly.addEventListener("click", ()=>selectRegion(item.id, poly));
  svg.appendChild(poly);

  const label = document.createElementNS(NS,"text");
  label.setAttribute("x", item.cx);
  label.setAttribute("y", item.cy+4);
  label.setAttribute("class","hexlabel");
  label.style.pointerEvents = "none";
  const lines = item.label.split("\n");
  lines.forEach((ln,i)=>{
    const tspan = document.createElementNS(NS,"tspan");
    tspan.setAttribute("x", item.cx);
    tspan.setAttribute("dy", i===0 ? (lines.length>1 ? -5 : 0) : 11);
    tspan.textContent = ln;
    label.appendChild(tspan);
  });
  svg.appendChild(label);
});

// Praha — small hex near Středočeský center
const strc = layout.find(l=>l.id==="stredocesky");
const prahaCx = strc.cx + 6, prahaCy = strc.cy - 34;
const prahaPoly = document.createElementNS(NS,"polygon");
prahaPoly.setAttribute("points", hexPoints(prahaCx, prahaCy, 20));
prahaPoly.setAttribute("class","hex-praha");
prahaPoly.setAttribute("data-id","praha");
prahaPoly.addEventListener("click", ()=>selectRegion("praha", prahaPoly));
svg.appendChild(prahaPoly);

const prahaLabel = document.createElementNS(NS,"text");
prahaLabel.setAttribute("x", prahaCx);
prahaLabel.setAttribute("y", prahaCy+3);
prahaLabel.setAttribute("class","hexlabel small");
prahaLabel.textContent = "Praha";
svg.appendChild(prahaLabel);

let activeEl = null;
function selectRegion(id, el){
  if(activeEl) activeEl.classList.remove("active");
  el.classList.add("active");
  activeEl = el;

  const r = regions[id];
  document.getElementById("panelEmpty").style.display = "none";
  const content = document.getElementById("panelContent");
  content.style.display = "block";
  content.innerHTML = `
    <p class="region-eyebrow">Kraj</p>
    <h2 class="region-title">${r.name}</h2>
    <p class="region-capital">Krajské město: <strong>${r.capital}</strong></p>

    <div class="stat-grid">
      <div class="stat"><div class="k">Rozloha</div><div class="v">${r.area}</div></div>
      <div class="stat"><div class="k">Obyvatelé</div><div class="v">${r.population}</div></div>
      <div class="stat"><div class="k">Okresy</div><div class="v">${r.districts}</div></div>
      <div class="stat"><div class="k">Nejvyšší bod</div><div class="v">${r.highest}</div></div>
    </div>

    <div class="section">
      <h3>Řeky</h3>
      <p>${r.rivers}</p>
    </div>
    <div class="section">
      <h3>Sousedství</h3>
      <p>${r.neighbors}</p>
    </div>
    <div class="section">
      <h3>Významná města</h3>
      <p>${r.cities}</p>
    </div>
    <div class="section">
      <h3>Ekonomika</h3>
      <p>${r.economy}</p>
    </div>
    <div class="section">
      <h3>Zajímavosti</h3>
      <p>${r.attractions}</p>
    </div>
    <div class="funfact">${r.fact}</div>
  `;
}
</script>
</body>
</html>
