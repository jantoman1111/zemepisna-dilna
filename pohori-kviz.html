<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slepá mapa — Pohoří a nížiny ČR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1: #FFF3D6;
    --bg2: #E4F5FF;
    --bg3: #FDE8FF;
    --ink: #2B2450;
    --card: #FFFFFF;
    --good: #2F9E44;
    --good-bg: #D3F9D8;
    --bad: #E03131;
    --bad-bg: #FFE3E3;
    --purple: #845EF7;
    --pink: #F06595;
    --orange: #FF922B;
    --shadow: rgba(43,36,80,0.16);
    --land: #CFE8B0;
    --land-stroke: #5B8A3A;
    --sea: #DCEEFB;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; font-family:'Quicksand', sans-serif; color: var(--ink); }
  body {
    background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
    background-attachment: fixed;
    min-height: 100vh;
  }
  .wrap { max-width: 1120px; margin:0 auto; padding: 14px 18px 20px; }

  header {
    display:flex; justify-content: space-between; align-items:center;
    margin-bottom: 10px; flex-wrap: wrap; gap: 10px;
  }
  .title-block .eyebrow {
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:11px;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--purple); margin:0 0 1px;
  }
  h1 {
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size: clamp(18px,2.6vw,26px);
    margin:0; color: var(--ink);
  }
  .scorebox {
    background: var(--card); border-radius: 14px; padding: 7px 14px;
    box-shadow: 0 4px 0 var(--shadow); font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:12px; display:flex; gap:14px; align-items:center;
  }
  .scorebox .n { font-size: 18px; color: var(--purple); }
  .scorebox .r { color: var(--orange); }

  .mode-switch { display:flex; gap:8px; margin-bottom: 10px; flex-wrap: wrap; }
  .mode-switch button {
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size: 12px;
    border: none; border-radius: 12px; padding: 7px 14px; cursor:pointer;
    background: var(--card); color: var(--ink); box-shadow: 0 3px 0 var(--shadow);
    transition: transform 0.1s ease;
  }
  .mode-switch button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
  .mode-switch button.active { background: linear-gradient(135deg, var(--purple), var(--pink)); color: white; }

  .prompt-bar {
    background: var(--card); border-radius: 16px; padding: 10px 16px; margin-bottom: 8px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    box-shadow: 0 4px 0 var(--shadow);
  }
  .prompt-bar .task-label {
    font-family:'Baloo 2', sans-serif; font-size:10px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.06em; color: var(--purple); margin:0 0 2px;
  }
  .prompt-bar h2 { font-family:'Baloo 2', sans-serif; font-size: 19px; font-weight:800; margin:0; color: var(--ink); }
  .prompt-bar .sub { font-family:'Quicksand', sans-serif; font-size: 12px; color:#6B637F; margin-top:2px; }
  .feedback {
    font-family:'Baloo 2', sans-serif; font-size: 12px; font-weight:700;
    padding: 6px 12px; border-radius: 16px; min-width: 120px; text-align:center;
    opacity: 0; transition: opacity 0.15s ease, transform 0.15s ease; transform: scale(0.9);
  }
  .feedback.show { opacity: 1; transform: scale(1); }
  .feedback.good { background: var(--good-bg); color: var(--good); }
  .feedback.bad { background: var(--bad-bg); color: var(--bad); }

  .progress-track {
    height: 6px; background: rgba(255,255,255,0.6); border-radius: 8px; overflow:hidden; margin-bottom: 10px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
  }
  .progress-fill {
    height:100%; width:0%; border-radius: 8px;
    background: linear-gradient(90deg, var(--orange), var(--pink), var(--purple));
    transition: width 0.3s ease;
  }

  .layout { display:grid; grid-template-columns: 1fr; gap: 10px; }
  .map-panel {
    background: var(--card); border-radius: 18px; padding: 10px;
    box-shadow: 0 6px 0 var(--shadow);
    display:flex; flex-direction:column; align-items:center;
  }
  svg { display:block; width:auto; height:auto; max-height: min(58vh, 520px); max-width: 100%; transition: max-height 0.15s ease; }
  svg.compact { max-height: min(34vh, 300px); }

  rect.sea { fill: var(--sea); }
  path.outline { fill: var(--land); stroke: var(--land-stroke); stroke-width: 2.4; }

  ellipse.marker {
    stroke: rgba(43,36,80,0.55); stroke-width: 1.4; cursor: pointer;
    fill-opacity: 0.72;
    transition: filter 0.12s ease, fill-opacity 0.12s ease, stroke-width 0.12s ease;
  }
  ellipse.marker:hover { filter: brightness(1.1); fill-opacity: 0.88; }
  ellipse.marker.no-interact { cursor: default; pointer-events: none; }
  ellipse.marker.correct-flash { fill: var(--good) !important; stroke: #2F7A33; fill-opacity: 0.9; }
  ellipse.marker.wrong-flash { fill: var(--bad) !important; stroke: #A61E1E; fill-opacity: 0.9; }
  ellipse.marker.target-hint { stroke: #FFD43B; stroke-width: 3.5; }
  ellipse.marker.target-hint-anim { animation: pulseStroke 0.9s ease-in-out infinite; }
  @keyframes pulseStroke { 0%,100% { stroke-width: 3.5; } 50% { stroke-width: 6; } }
  ellipse.marker.solved { opacity: 0.4; }

  .marker-check {
    font-size: 15px; text-anchor: middle; pointer-events:none; opacity:0;
    transition: opacity 0.2s ease; font-weight:700;
  }
  .marker-check.show { opacity: 1; }

  .legend-row {
    display:flex; justify-content: space-between; align-items:center; margin-top:8px;
    font-family:'Quicksand', sans-serif; font-size:11px; color: #6B637F; flex-wrap: wrap; gap: 8px;
    width: 100%;
  }
  .btn {
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:11px;
    background: var(--ink); color: white; border:none; border-radius: 12px;
    padding: 6px 14px; cursor:pointer; box-shadow: 0 3px 0 rgba(0,0,0,0.25);
  }
  .btn:active { transform: translateY(2px); box-shadow: none; }

  .choice-grid {
    display:grid; grid-template-columns: repeat(2, 1fr);
    gap: 8px; margin-top: 8px; width: 100%; max-width: 520px;
  }
  .choice-grid button {
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size: 12.5px;
    border: none; border-radius: 12px; padding: 10px 8px; cursor:pointer;
    color: white; box-shadow: 0 3px 0 rgba(0,0,0,0.18);
    transition: transform 0.08s ease;
  }
  @media (max-width: 560px) { .choice-grid { grid-template-columns: 1fr; } }
  .choice-grid button:active { transform: translateY(2px); box-shadow:none; }
  .choice-grid button:disabled { opacity: 0.4; cursor: default; }
  .choice-grid.hidden { display:none; }

  .end-screen {
    background: var(--card); border-radius: 24px;
    padding: 34px 26px; text-align:center; box-shadow: 0 8px 0 var(--shadow);
  }
  .end-screen .emoji { font-size: 46px; margin-bottom: 6px; }
  .end-screen h2 { font-family:'Baloo 2', sans-serif; font-size: 26px; margin: 0 0 6px; }
  .end-screen .big-score {
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size: 46px;
    background: linear-gradient(135deg, var(--orange), var(--pink), var(--purple));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin: 8px 0;
  }
  .end-screen .missed {
    font-family:'Quicksand', sans-serif; font-size: 13px; color: #5A5270;
    margin: 12px 0 18px; text-align:left; max-width: 460px; margin-left:auto; margin-right:auto; line-height:1.8;
  }
  .mode-row { display:flex; gap:10px; justify-content:center; margin-top: 8px; flex-wrap: wrap; }

  footer { margin-top: 10px; font-family:'Quicksand', sans-serif; font-size:10px; color: #7A7290; text-align:center; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <p class="eyebrow">Slepá mapa · procvičování</p>
      <h1>Pohoří a nížiny České republiky</h1>
    </div>
    <div class="scorebox">
      <span>Skóre <span class="n" id="scoreNow">0</span>/<span id="scoreTotal">0</span></span>
      <span>Zbývá <span class="r" id="remainingCount">17</span></span>
    </div>
  </header>

  <div class="mode-switch">
    <button id="modePlaceBtn" class="active">🏔️ Podle pohoří → najdi na mapě</button>
    <button id="modePeakBtn">⛰️ Podle vrcholu → vyber pohoří</button>
  </div>

  <div id="quizScreen">
    <div class="prompt-bar">
      <div>
        <p class="task-label" id="taskLabel">Najděte na mapě</p>
        <h2 id="targetName">—</h2>
        <div class="sub" id="targetSub"></div>
      </div>
      <div class="feedback" id="feedback">—</div>
    </div>

    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

    <div class="layout">
      <div class="map-panel">
        <svg id="map" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="legend-row">
          <span id="hintText">Klikněte na bod, který odpovídá zadání nahoře</span>
          <button class="btn" id="skipBtn">Přeskočit →</button>
        </div>
        <div class="choice-grid hidden" id="choiceGrid"></div>
      </div>
    </div>
  </div>

  <div id="endScreen" class="end-screen hidden">
    <div class="emoji" id="endEmoji">🎉</div>
    <h2>Výsledek testu</h2>
    <div class="big-score" id="finalScore">0 / 17</div>
    <div class="missed" id="missedList"></div>
    <div class="mode-row"><button class="btn" id="restartBtn">Zkusit znovu</button></div>
  </div>

  <footer>Body na mapě jsou bez popisků — barva se schová (ztlumí) až po správné odpovědi 😉</footer>
</div>

  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];

}

    t.setAttribute('class', 'marker-check');
    t.textContent = '✓';
    svg.appendChild(t);
    checkEls[itemKey(it)] = t;
  });
}

function buildChoiceGrid(correctKey){
  choiceGrid.innerHTML = '';
  const rangeItems = allItems.filter(it=>it.type==='range');
  const correctItem = itemByKey(correctKey);
  const others = rangeItems.filter(it=> itemKey(it) !== correctKey);
  const distractors = shuffle(others).slice(0,3);
  const options = shuffle([correctItem, ...distractors]);
  options.forEach(it=>{
    const btn = document.createElement('button');
    btn.textContent = it.name;
    const gi = allItems.indexOf(it);
    btn.style.background = PALETTE[gi % PALETTE.length];
    btn.dataset.key = itemKey(it);
    btn.addEventListener('click', ()=> handlePick(itemKey(it)));
    choiceGrid.appendChild(btn);
  });
}

function setMode(m){
  mode = m;
  modePlaceBtn.classList.toggle('active', m==='place');
  modePeakBtn.classList.toggle('active', m==='peak');
  startGame();
}
modePlaceBtn.addEventListener('click', ()=> setMode('place'));
modePeakBtn.addEventListener('click', ()=> setMode('peak'));

function startGame(){
  score = 0; missed = []; locked = false; idx = 0;
  allItems = buildItems();
  buildMap();

  if(mode === 'place'){
    order = shuffle(allItems.map(itemKey));
    hintText.textContent = 'Klikněte na bod, který odpovídá zadání nahoře';
    choiceGrid.classList.add('hidden');
    svg.classList.remove('compact');
  } else {
    order = shuffle(MAP_DATA.ranges.map(r=> itemKey({type:'range', name:r.name})));
    hintText.textContent = 'Vyberte jednu ze čtyř možností níže';
    choiceGrid.classList.remove('hidden');
    svg.classList.add('compact');
  }

  scoreTotal.textContent = order.length;
  quizScreen.classList.remove('hidden');
  endScreen.classList.add('hidden');
  nextQuestion();
}

function nextQuestion(){
  updateHUD();
  document.querySelectorAll('.choice-grid button').forEach(b=> b.disabled = false);
  if(idx >= order.length){ return endGame(); }
  feedback.className = 'feedback';
  feedback.textContent = '—';
  targetSub.textContent = '';

  const key = order[idx];
  const it = itemByKey(key);

  if(mode === 'place'){
    taskLabel.textContent = it.type === 'range' ? 'Najděte pohoří na mapě' : 'Najděte nížinu na mapě';
    targetName.textContent = it.name;
  } else {
    taskLabel.textContent = 'Ve kterém pohoří leží vrchol';
    targetName.textContent = it.peak;
    targetSub.textContent = it.elev + ' m n. m.';
    buildChoiceGrid(key);
  }
  locked = false;
}

function updateHUD(){
  scoreNow.textContent = score;
  remainingCount.textContent = Math.max(order.length - idx, 0);
  progressFill.style.width = (idx/order.length*100) + '%';
}

function markSolved(key){
  const el = markerEls[key];
  el.classList.add('solved');
  checkEls[key].classList.add('show');
}

function handlePick(pickedKey){
  if(locked) return;
  const correctKey = order[idx];
  locked = true;
  document.querySelectorAll('.choice-grid button').forEach(b=> b.disabled = true);
  const pickedEl = markerEls[pickedKey];
  const correctEl = markerEls[correctKey];
  const correctItem = itemByKey(correctKey);

  if(pickedKey === correctKey){
    score++;
    pickedEl.classList.add('correct-flash');
    feedback.textContent = '✓ Správně!';
    feedback.className = 'feedback show good';
    setTimeout(()=>{
      pickedEl.classList.remove('correct-flash');
      markSolved(correctKey);
      idx++; nextQuestion();
    }, 600);
  } else {
    missed.push(mode==='place' ? correctItem.name : (correctItem.peak + ' (' + correctItem.name + ')'));
    pickedEl.classList.add('wrong-flash');
    correctEl.classList.add('target-hint','target-hint-anim');
    feedback.textContent = '✗ Bylo to ' + correctItem.name;
    feedback.className = 'feedback show bad';
    setTimeout(()=>{
      pickedEl.classList.remove('wrong-flash');
      correctEl.classList.remove('target-hint','target-hint-anim');
      markSolved(correctKey);
      idx++; nextQuestion();
    }, 1200);
  }
}

skipBtn.addEventListener('click', ()=>{
  if(locked) return;
  locked = true;
  document.querySelectorAll('.choice-grid button').forEach(b=> b.disabled = true);
  const correctKey = order[idx];
  const correctItem = itemByKey(correctKey);
  missed.push(mode==='place' ? correctItem.name : (correctItem.peak + ' (' + correctItem.name + ')'));
  const correctEl = markerEls[correctKey];
  correctEl.classList.add('target-hint','target-hint-anim');
  feedback.textContent = '↷ Bylo to ' + correctItem.name;
  feedback.className = 'feedback show bad';
  setTimeout(()=>{
    correctEl.classList.remove('target-hint','target-hint-anim');
    markSolved(correctKey);
    idx++; nextQuestion();
  }, 1000);
});

function endGame(){
  quizScreen.classList.add('hidden');
  endScreen.classList.remove('hidden');
  finalScore.textContent = score + ' / ' + order.length;
  endEmoji.textContent = score === order.length ? '🏆' : (score >= order.length*0.7 ? '🎉' : '💪');
  if(missed.length === 0){
    missedList.innerHTML = '<strong style="color:var(--good)">Všechny odpovědi správně napoprvé — paráda!</strong>';
  } else {
    missedList.innerHTML = '<strong>K zopakování:</strong><br>' + missed.map(m=>'&middot; '+m).join('<br>');
  }
}

restartBtn.addEventListener('click', startGame);

startGame();
</script>
</body>
</html>
