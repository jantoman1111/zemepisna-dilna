<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap">
<style>
/* Layout: one projector screen — tab bar, one big card in the middle, control bar at the bottom. Deliberately single bright theme for projection; every round has its own color. */
:root {
  --night: #eaf4fb;        /* page background (light sky) */
  --fjord: #fffdf8;        /* card surface */
  --ice: #132a3e;          /* main text */
  --frost: #4b6377;        /* secondary text */
  --line: #c9dbe8;         /* borders */
  --truth: #2fbf9a;        /* PRAVDA (green-teal) */
  --troll: #ff8a3d;        /* TROLL (orange) */
  --sun: #ffc93c;          /* info / hint */
  --on-color: #10202e;     /* text on bright verdict chips */
  --accent: #1f6fd1;       /* per-round color, set in script */
  --c-start: #1f6fd1; --c-rozcvicka: #7b4fd6; --c-text: #1f6fd1; --c-kviz: #e0562b;
  --c-mapa: #178a5f; --c-odhad: #c4387f; --c-finale: #b06d00;
  --sea: #cfe8f7; --sea-line: #b3d5ec; --land: #fff6dc; --land-other: #e4e2e8; --border: #93a9bb;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --font-body: "Atkinson Hyperlegible", Verdana, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: linear-gradient(160deg, #e3f1fc 0%, #f3ecfb 50%, #fff1e3 100%) fixed, var(--night);
  color: var(--ice);
  font-family: var(--font-body);
  font-size: 18px;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box;
  gap: 12px;
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

nav {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
}
.brand {
  font-family: var(--font-display); font-weight: 800; font-size: 20px;
  margin-right: 12px; color: var(--accent); letter-spacing: 0.01em;
}
nav button.tab {
  background: var(--fjord); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 14px; font-size: 16px; color: var(--frost);
}
nav button.tab[aria-current="true"] { background: var(--accent); color: #ffffff; border-color: var(--accent); font-weight: 700; }
nav .spacer { flex: 1; }
nav button.fs { background: var(--fjord); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 15px; color: var(--frost); }

main {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  overflow-y: auto;
}
.card {
  width: 100%; max-width: 1400px;
  background: var(--fjord); border: 1px solid var(--line); border-top: 14px solid var(--accent); border-radius: 20px;
  box-shadow: 0 10px 40px rgba(31, 60, 100, 0.12);
  padding: clamp(20px, 4vw, 64px);
  display: flex; flex-direction: column; gap: clamp(14px, 2.2vh, 32px);
}
.eyebrow {
  font-size: clamp(15px, 1.4vw, 24px); text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--accent); font-weight: 700;
}
.statement {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(28px, 4.4vw, 76px); line-height: 1.12; text-wrap: balance; margin: 0;
}
.reading h2 {
  font-family: var(--font-display); font-weight: 800; color: var(--accent);
  font-size: clamp(26px, 3.2vw, 56px); margin: 0; line-height: 1.1; text-wrap: balance;
}
.reading p {
  font-size: clamp(22px, 2.5vw, 42px); line-height: 1.45; margin: 0; max-width: 40ch;
}
.reading p + p { margin-top: 0.6em; }

.answer {
  display: flex; flex-direction: column; gap: 12px;
  border-top: 3px dashed var(--line); padding-top: clamp(14px, 2vh, 28px);
}
.verdict {
  align-self: flex-start;
  font-family: var(--font-display); font-weight: 800;
  font-size: clamp(30px, 4vw, 68px); line-height: 1;
  padding: 0.15em 0.5em; border-radius: 12px; color: var(--on-color);
}
.verdict.truth { background: var(--truth); }
.verdict.troll { background: var(--troll); }
.verdict.info { background: var(--sun); }
.explain { font-size: clamp(22px, 2.6vw, 44px); line-height: 1.35; margin: 0; max-width: 42ch; }
.note { font-size: clamp(18px, 1.8vw, 30px); color: var(--frost); margin: 0; font-style: italic; }

.home { text-align: left; }
.home h1 {
  font-family: var(--font-display); font-weight: 800; margin: 0; line-height: 1;
  font-size: clamp(44px, 8vw, 140px); text-wrap: balance;
}
.home h1 span { color: var(--c-kviz); }
.home .lead { font-size: clamp(20px, 2.2vw, 36px); color: var(--frost); margin: 0; max-width: 40ch; }
.rounds { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.rounds button {
  text-align: left; background: color-mix(in srgb, var(--accent) 10%, var(--fjord)); border: 2px solid var(--accent); border-radius: 14px;
  padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; min-width: 0;
}
.rounds button:hover { background: color-mix(in srgb, var(--accent) 20%, var(--fjord)); }
.rounds b { color: var(--accent); font-family: var(--font-display); font-size: clamp(20px, 1.8vw, 28px); }
.rounds small { font-size: 15px; color: var(--frost); }

.controls {
  display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
}
.controls button {
  border-radius: 12px; border: 1px solid var(--line); background: var(--fjord);
  padding: 10px 20px; font-size: clamp(17px, 1.5vw, 24px); min-width: 64px;
}
.controls button.primary { background: var(--accent); color: #ffffff; border-color: var(--accent); font-weight: 700; }
.controls button:disabled { opacity: 0.35; cursor: default; }
.counter { font-variant-numeric: tabular-nums; color: var(--frost); font-size: clamp(16px, 1.4vw, 22px); min-width: 5ch; text-align: center; }
.hint { color: var(--frost); font-size: 14px; text-align: center; }

/* map round */
.card.with-map { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.4fr); gap: clamp(16px, 2.5vw, 40px); align-items: center; }
.card.with-map .side { display: flex; flex-direction: column; gap: clamp(12px, 2vh, 24px); min-width: 0; }
.card.with-map .statement { font-size: clamp(28px, 3.6vw, 64px); }
.card.with-map .explain { font-size: clamp(20px, 2vw, 34px); }
.mapbox { min-width: 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--sea); }
.mapbox svg { display: block; width: 100%; height: auto; max-height: 66vh; }
.m-sea { fill: var(--sea); }
.m-grat { fill: none; stroke: var(--sea-line); stroke-width: 1; }
.m-other { fill: var(--land-other); stroke: #ffffff; stroke-width: 0.8; }
.m-focus { fill: var(--land); stroke: var(--border); stroke-width: 1; }
.m-hl { fill: var(--accent); fill-opacity: 0.55; stroke: var(--accent); stroke-width: 2; }
.m-line { fill: none; stroke: var(--accent); stroke-width: 5; stroke-dasharray: 14 9; }
.m-dot { fill: var(--accent); stroke: #ffffff; stroke-width: 3; }
.m-ring { fill: var(--accent); fill-opacity: 0.18; stroke: var(--accent); stroke-width: 4; }
.m-label { font-family: var(--font-display); font-weight: 800; font-size: 30px; fill: var(--ice); paint-order: stroke; stroke: #ffffff; stroke-width: 7px; stroke-linejoin: round; }
@media (prefers-reduced-motion: no-preference) {
  .m-ring { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%,100% { transform: scale(0.9); } 50% { transform: scale(1.08); } }
}
@media (max-width: 760px) { .card.with-map { grid-template-columns: 1fr; } }
@media (max-width: 700px) { .hint { display: none; } }
@media (prefers-reduced-motion: no-preference) {
  .answer { animation: up 0.35s ease-out; }
  @keyframes up { from { opacity: 0.2; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}

      .forEach(c => cp.append(sv("path", { d: c.d })));
    svg.append(cp);
    svg.append(sv("path", { class: "m-hl", d: MAP.lapland, "clip-path": "url(#lapclip)" }));
  }
  if (h.line) svg.append(sv("path", { class: "m-line", d: MAP.polar }));
  if (h.ring) { const [k, r] = h.ring; svg.append(sv("circle", { class: "m-ring", cx: P[k][0], cy: P[k][1], r })); }
  if (h.dot) svg.append(sv("circle", { class: "m-dot", cx: P[h.dot][0], cy: P[h.dot][1], r: 11 }));
  if (h.label) {
    const [k, text, dx, dy] = h.label;
    const t = sv("text", { class: "m-label", x: P[k][0] + dx, y: P[k][1] + dy });
    t.textContent = text; svg.append(t);
  }
  return svg;
}

const state = { view: "start", index: {}, revealed: false };
const stage = document.getElementById("stage");
const counter = document.getElementById("counter");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const revealBtn = document.getElementById("revealBtn");
const controls = document.getElementById("controls");
const hint = document.getElementById("hint");

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function renderHome() {
  const card = el("section", "card home");
  const h = el("h1");
  h.append("Pravda, nebo ", Object.assign(el("span"), { textContent: "troll?" }));
  card.append(el("div", "eyebrow", "Zeměpis · 8. třída · Severní Evropa"), h,
    el("p", "lead", "Troll ze severských pověstí lže. Poznáte, kdy mluví pravdu?"));
  const grid = el("div", "rounds");
  const list = [
    ["rozcvicka", "0. Tipování", "5 tvrzení před čtením"],
    ["text", "Text: Na sever!", "Čtení, pak text schovat"],
    ["kviz", "1. Pravda, nebo troll?", "14 tvrzení, 1 bod"],
    ["mapa", "2. Ukaž na mapě", "10 míst, 2 body"],
    ["odhad", "3. Odhadovačka", "4 čísla, 3 body"],
    ["finale", "4. Finále", "Sázka 0–5 bodů"]
  ];
  for (const [v, t, s] of list) {
    const b = el("button");
    b.type = "button";
    b.style.setProperty("--accent", "var(--c-" + v + ")");
    b.append(el("b", null, t), el("small", null, s));
    b.addEventListener("click", () => go(v));
    grid.append(b);
  }
  card.append(grid);
  stage.replaceChildren(card);
  controls.hidden = true; hint.hidden = true;
}

function render() {
  document.documentElement.style.setProperty("--accent", "var(--c-" + state.view + ")");
  document.querySelectorAll("nav .tab").forEach(b => b.setAttribute("aria-current", String(b.dataset.view === state.view)));
  if (state.view === "start") return renderHome();
  controls.hidden = false; hint.hidden = false;
  const v = VIEWS[state.view];
  const i = state.index[state.view] || 0;
  const item = v.items[i];
  const card = el("section", "card");
  card.append(el("div", "eyebrow", v.label));

  if (state.view === "text") {
    card.classList.add("reading");
    card.append(el("h2", null, item.h));
    const wrap = el("div");
    item.p.forEach(t => wrap.append(el("p", null, t)));
    card.append(wrap);
  } else if (item.mapKey) {
    card.classList.add("with-map");
    const side = el("div", "side");
    side.append(card.firstChild, el("p", "statement", item.statement));
    if (v.note && !state.revealed) side.append(el("p", "note", v.note));
    if (state.revealed) {
      const a = el("div", "answer");
      a.append(el("div", "verdict info", item.verdictText), el("p", "explain", item.explain));
      side.append(a);
    }
    const box = el("div", "mapbox");
    box.append(buildMap(item.mapKey, state.revealed));
    card.append(side, box);
  } else {
    card.append(el("p", "statement", item.statement));
    if (v.note) card.append(el("p", "note", v.note));
    if (v.reveal && state.revealed) {
      const a = el("div", "answer");
      const label = item.verdict === T ? "PRAVDA" : item.verdict === X ? "TROLL" : item.verdictText;
      a.append(el("div", "verdict " + item.verdict, label));
      if (item.explain) a.append(el("p", "explain", item.explain));
      card.append(a);
    }
  }
  stage.replaceChildren(card);
  stage.scrollTop = 0;
  counter.textContent = (i + 1) + " / " + v.items.length;
  prevBtn.disabled = i === 0;
  nextBtn.disabled = i === v.items.length - 1;
  revealBtn.hidden = !v.reveal;
  revealBtn.textContent = state.revealed ? "Skrýt odpověď" : (v.revealLabel || "Ukázat odpověď");
}

function go(view) {
  if (!VIEWS[view] && view !== "start") view = "start";
  state.view = view; state.revealed = false;
  if (location.hash !== "#" + view) history.replaceState(null, "", "#" + view);
  render();
}
function step(d) {
  const v = VIEWS[state.view]; if (!v) return;
  const i = (state.index[state.view] || 0) + d;
  if (i < 0 || i >= v.items.length) return;
  state.index[state.view] = i; state.revealed = false; render();
}
function toggleReveal() {
  const v = VIEWS[state.view]; if (!v || !v.reveal) return;
  state.revealed = !state.revealed; render();
}

document.querySelectorAll("nav .tab").forEach(b => b.addEventListener("click", () => go(b.dataset.view)));
prevBtn.addEventListener("click", () => step(-1));
nextBtn.addEventListener("click", () => step(1));
revealBtn.addEventListener("click", toggleReveal);
document.getElementById("fsBtn").addEventListener("click", () => {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  } catch (e) {}
});
document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); step(1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); step(-1); }
  else if (e.key === " " || e.key === "Enter") {
    if (e.target.closest && e.target.closest("button") && e.key === "Enter") return;
    e.preventDefault(); toggleReveal();
  }
  else if (e.key === "f" || e.key === "F") document.getElementById("fsBtn").click();
});
window.addEventListener("hashchange", () => go(location.hash.slice(1) || "start"));
go(location.hash.slice(1) || "start");
</script>
