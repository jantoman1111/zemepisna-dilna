<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hádej zemi podle siluety | Zeměpisná dílna</title>
<style>
:root{--bg:#0e1a2e;--card:#16263f;--card2:#1d3150;--line:#2b4568;--tx:#eaf1fb;--mut:#93a8c6;--ac:#ffb84d;--ok:#2ecc71;--bad:#ff5a5f;--blue:#4da3ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Segoe UI',Verdana,Arial,sans-serif;background:radial-gradient(ellipse 80% 50% at 50% 0%,#1c3b6b 0%,transparent 70%),var(--bg);color:var(--tx);padding:14px 12px 30px}
.wrap{max-width:660px;margin:0 auto}
h1{font-size:1.5rem;text-align:center;font-weight:800;letter-spacing:-.01em}
h1 span{color:var(--ac)}
.sub{text-align:center;color:var(--mut);font-size:.95rem;margin:.3rem 0 1rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.lbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:700;margin:12px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card2);color:var(--tx);padding:9px 14px;border-radius:99px;font-size:.95rem;font-weight:600;cursor:pointer;font-family:inherit}
.chip.on{background:var(--ac);color:#2b1a00;border-color:var(--ac)}
.big{display:block;width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#ffb84d,#ff8a3d);color:#2b1400;font-size:1.15rem;font-weight:800;cursor:pointer;font-family:inherit}
.big:active{transform:scale(.98)}
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.95rem;margin-bottom:8px;gap:8px}
.hud b{color:var(--ac)}
.bar{height:10px;border-radius:99px;background:var(--card2);overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#2ecc71,#ffd84d,#ff5a5f);background-size:300% 100%;transform-origin:left}
.stage{background:radial-gradient(circle at 50% 40%,#244a80 0%,#14243d 70%);border:1px solid var(--line);border-radius:18px;padding:8px;position:relative}
.stage svg{display:block;width:100%;max-height:44vh;aspect-ratio:1/1;margin:0 auto}
.stage path{fill:#f4f8ff;stroke:#ffb84d;stroke-width:1.6;stroke-linejoin:round;filter:drop-shadow(0 0 7px rgba(255,184,77,.55));transition:fill .35s}
.stage.ok path{fill:var(--ok);stroke:#bff5d3}
.stage.bad path{fill:var(--bad);stroke:#ffd0d1}
.q{text-align:center;font-weight:800;font-size:1.15rem;margin:12px 0 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opt{padding:13px 8px;border-radius:13px;border:2px solid var(--line);background:var(--card2);color:var(--tx);font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.ok{background:#164c2d;border-color:var(--ok)}
.opt.bad{background:#5a1c24;border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{min-height:62px;text-align:center;margin-top:10px;font-size:1rem}
.fb strong{font-size:1.1rem}
.nx{margin-top:6px;padding:11px 26px;border-radius:12px;border:0;background:var(--blue);color:#04152b;font-weight:800;font-size:1rem;cursor:pointer;font-family:inherit}
.score-big{font-size:3rem;font-weight:900;color:var(--ac);text-align:center}
.stars{text-align:center;font-size:2rem;margin:4px 0}
.msg{text-align:center;color:var(--mut);margin-bottom:10px}
.mist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.m{display:flex;gap:10px;align-items:center;background:var(--card2);border-radius:10px;padding:6px 10px;font-size:.95rem}
.m svg{width:42px;height:42px;flex:none}.m svg path{fill:#f4f8ff}
.m small{color:var(--mut)}
.row2{display:flex;gap:10px}.row2 .big{margin-top:14px}
.ghost{background:var(--card2)!important;color:var(--tx)!important;border:1.5px solid var(--line)!important}
.hide{display:none}
@media(max-width:420px){.opts{gap:7px}.opt{font-size:.92rem;padding:11px 6px}}
</style>
</head>
<body>
<div class="wrap">
<h1>🗺 Hádej zemi <span>podle siluety</span></h1>
<p class="sub">Poznáš stát jen podle obrysu? Vyber správnou odpověď dřív, než vyprší čas.</p>

<div class="panel" id="start">
  <div class="lbl">Kde budeme hádat?</div>
  <div class="chips" id="cont"></div>
  <div class="lbl">Obtížnost</div>
  <div class="chips" id="diff"></div>
  <div class="lbl">Počet kol</div>
  <div class="chips" id="rounds"></div>
  <button class="big" id="go">▶ Začít hru</button>
</div>

<div id="game" class="hide">
  <div class="hud"><span>Kolo <b id="rn">1</b>/<b id="rt">10</b></span><span id="streak"></span><span>Skóre <b id="sc">0</b></span></div>
  <div class="bar" id="barw"><i id="bar"></i></div>
  <div class="stage" id="stage"><svg viewBox="0 0 300 300"><path id="shape" d=""/></svg></div>
  <div class="q">Která země to je?</div>
  <div class="opts" id="opts"></div>
  <div class="fb" id="fb"></div>
</div>

<div class="panel hide" id="end">
  <div class="stars" id="stars"></div>
  <div class="score-big" id="fs"></div>
  <div class="msg" id="fm"></div>
  <div class="lbl" id="mh">Tohle si ještě zopakuj</div>
  <div class="mist" id="mist"></div>
  <div class="row2"><button class="big" id="again">🔁 Hrát znovu</button><button class="big ghost" id="menu">⚙ Nastavení</button></div>
</div>
</div>

  $('mist').innerHTML=G.miss.map(c=>'<div class="m"><svg viewBox="0 0 300 300"><path d="'+c.d+'"/></svg><div><b>'+c.n+'</b><br><small>hlavní město '+c.c+'</small></div></div>').join('');
}
$('go').onclick=start;$('again').onclick=start;$('menu').onclick=()=>{$('end').classList.add('hide');$('start').classList.remove('hide')};
document.addEventListener('keydown',e=>{if(!G||$('game').classList.contains('hide'))return;
  if(e.key==='Enter'&&G.lock){const n=$('nx');if(n)n.click();return}
  const k=parseInt(e.key);if(k>=1&&k<=G.opts){const b=document.querySelectorAll('.opt')[k-1];if(b&&!b.disabled)b.click()}});
menu();
</script>
</body>
</html>
