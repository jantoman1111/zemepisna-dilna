<title>Generátor testů</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: ovládací panel nahoře, pod ním náhledy listů jako papíry na stole */
:root {
  --bg: #eef0ea;          /* stůl – šedozelená */
  --panel: #ffffff;
  --fg: #23271f;
  --muted: #5d6458;
  --line: #cfd4c8;
  --accent: #8a4b1e;      /* hnědá jako pohoří na mapě */
  --accent-fg: #ffffff;
  --accent-soft: #f3e6da;
  --green: #2f7a35;
  --peak: #1d3fa8;
  --paper: #ffffff;       /* papír zůstává světlý v obou režimech */
  --ink: #1c1c1c;
  --task: #fff2cc;
  --task-line: #d9c27a;
  --font-display: "Bitter", Georgia, "Times New Roman", serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1e19; --panel: #252923; --fg: #e7eae2; --muted: #a3ab9c; --line: #3b4136;
    --accent: #d08b55; --accent-fg: #1b1e19; --accent-soft: #3a2c20; --green: #7cc483; --peak: #1d3fa8;
    --paper: #f4f4f0; --ink: #1c1c1c; --task: #fff2cc; --task-line: #d9c27a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1e19; --panel: #252923; --fg: #e7eae2; --muted: #a3ab9c; --line: #3b4136;
  --accent: #d08b55; --accent-fg: #1b1e19; --accent-soft: #3a2c20; --green: #7cc483; --peak: #1d3fa8;
  --paper: #f4f4f0; --ink: #1c1c1c; --task: #fff2cc; --task-line: #d9c27a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 24px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.7rem, 4vw, 2.4rem); line-height: 1.15; margin: 0; text-wrap: balance; }
.lead { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 18px; }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px 20px; align-items: end; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stepper { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
.stepper button { width: 44px; border: 0; background: transparent; color: var(--fg); font-size: 1.3rem; cursor: pointer; }
.stepper button:hover { background: var(--accent-soft); }
.stepper input { flex: 1; min-width: 0; text-align: center; border: 0; background: transparent; color: var(--fg); font: 700 1.15rem var(--font-body); padding: 8px 0; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }
.checks { display: grid; gap: 8px; }
.check { display: flex; gap: 10px; align-items: center; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding-top: 16px; }
.btn { font: 700 1rem var(--font-body); border-radius: 8px; padding: 11px 18px; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .55; cursor: progress; }
.btn:focus-visible, .stepper button:focus-visible, .stepper input:focus-visible, .seg button:focus-visible, .check input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.status { color: var(--muted); font-size: .92rem; min-height: 1.4em; }
.status.err { color: #b3261e; }
.seed { margin-left: auto; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }

.summary { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between; }
.summary h2 { font-family: var(--font-display); font-size: 1.3rem; margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); color: var(--fg); font: 700 .92rem var(--font-body); padding: 8px 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

.sheets { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 22px; }
.sheet { background: var(--paper); color: var(--ink); border-radius: 4px; padding: 18px 18px 20px; box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.08); display: grid; gap: 10px; min-width: 0; font-size: .86rem; }
.sheet-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-bottom: 1px solid #ddd; padding-bottom: 6px; }
.sheet-head b { font-family: var(--font-display); font-size: 1rem; }
.sheet-head span { color: #777; font-weight: 700; white-space: nowrap; }
.map { position: relative; width: 100%; aspect-ratio: 998 / 594; }
.map img { width: 100%; height: 100%; display: block; }
.tag { position: absolute; transform: translate(-50%, -50%); background: #fff; border: 2px solid; border-radius: 4px; font: 700 10px/1 var(--font-body); padding: 2px 3px; }
.tag.r { border-color: #8a4b1e; color: #8a4b1e; }
.tag.p { border-color: var(--peak); color: var(--peak); }
.tag.n { border-color: #2f7a35; color: #2f7a35; }
.lists { display: grid; grid-template-columns: 1.25fr 1fr; gap: 0 12px; }
.lists ol { list-style: none; margin: 0; padding: 0; }
.lists li { padding-left: 1.5em; text-indent: -1.5em; }
.lists li b { display: inline-block; min-width: 1.5em; text-indent: 0; }
.grid-tbl { width: 100%; border-collapse: collapse; table-layout: fixed; text-align: center; font-variant-numeric: tabular-nums; }
.grid-tbl th, .grid-tbl td { border: 1px solid #333; padding: 3px 0; }
.grid-tbl th { background: #e8e8e8; }
.grid-tbl td { height: 26px; color: var(--peak); font-weight: 700; }
.ans { display: grid; gap: 2px; }
.ans .row { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted #bbb; padding: 2px 0; }
.ans .row em { font-style: normal; font-weight: 700; color: var(--peak); text-align: right; white-space: nowrap; }
.diff { background: var(--task); border: 1px solid var(--task-line); border-radius: 4px; padding: 6px 8px; }
.note { color: var(--muted); font-size: .9rem; margin: 0; }

@media (max-width: 520px) {
  .seed { margin-left: 0; width: 100%; }
  .actions .btn { flex: 1 1 auto; }
}
@media (prefers-reduced-motion: no-preference) { .btn, .seg button { transition: filter .15s, border-color .15s; } }
.field.wide { grid-column: 1 / -1; }
.sel { font: 700 1.05rem var(--font-body); padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); width: 100%; max-width: 420px; }
.sel:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.map { aspect-ratio: 998 / 594; }
</style>

<div class="wrap">
  <header>
    <h1 id="h1">Generátor testů</h1>
    <p class="lead" id="lead"></p>
  </header>

  <section class="panel" aria-label="Nastavení">
    <div class="controls">
      <div class="field wide">
        <label for="topic">Téma testu</label>
        <select id="topic" class="sel" aria-label="Téma testu"></select>
      </div>
      <div class="field">
        <label for="count">Počet variant</label>
        <div class="stepper"><button type="button" data-step="count:-1" aria-label="Méně variant">−</button><input id="count" type="number" min="1" max="15" value="7" inputmode="numeric"><button type="button" data-step="count:1" aria-label="Více variant">+</button></div>
      </div>
      <div class="field">
        <label for="per" id="perLabel">Pohoří v jednom testu</label>
        <div class="stepper"><button type="button" data-step="per:-1" aria-label="Méně položek">−</button><input id="per" type="number" min="5" max="13" value="9" inputmode="numeric"><button type="button" data-step="per:1" aria-label="Více položek">+</button></div>
      </div>
      <div class="field">
        <span class="eyebrow">Obsah</span>
        <div class="checks">
          <label class="check" id="polabiRow"><input id="polabi" type="checkbox" checked> Přidat Polabskou nížinu</label>
          <label class="check"><input id="withKey" type="checkbox" checked> Přidat klíč k opravě</label>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="download" type="button">Stáhnout testy (.docx)</button>
      <button class="btn" id="reroll" type="button">Nové varianty</button>
      <span class="seed" id="seedInfo"></span>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </section>

  <section class="summary">
    <h2 id="sumTitle">Náhled</h2>
    <div class="seg" role="group" aria-label="Zobrazení náhledu">
      <button type="button" id="viewTest" aria-pressed="true">Test pro žáky</button>
      <button type="button" id="viewKey" aria-pressed="false">Klíč</button>
    </div>
  </section>
  <p class="note" id="note"></p>
  <div class="sheets" id="sheets"></div>
</div>

const fmtN = (h) => String(h).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const fmtV = (h, unit) => fmtN(h) + " " + unit;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rnd) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ===== Příprava tématu: položky (name, ans, r, p, h/lat) + mapa ===== */
const cache = {};
let worldTopo = null;
async function prepare(T) {
  if (cache[T.id]) return cache[T.id];
  let P;
  if (T.kind === "num") {
    P = { items: T.items(), src: T.mapSrc(), W: T.W, H: T.H };
    P.items = P.items.map((x) => ({ name: x.name, ans: x.peak, h: x.h, r: x.r, p: x.p }));
  } else {
    if (typeof d3 === "undefined" || typeof topojson === "undefined") throw new Error("Nepodařilo se načíst knihovny pro kreslení map. Zkontrolujte připojení.");
    if (!worldTopo) worldTopo = await (await fetch(WORLD_URL)).json();
    P = drawWorld(T.cont);
  }
  cache[T.id] = P;
  return P;
}

function poleOf(ring) {
  const xs = ring.map((q) => q[0]), ys = ring.map((q) => q[1]);
  const dist = (pt) => { let m = 1e9; for (let i = 0; i < ring.length; i++) { const a = ring[i], b = ring[(i + 1) % ring.length]; const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy; let t = L ? ((pt[0] - a[0]) * dx + (pt[1] - a[1]) * dy) / L : 0; t = Math.max(0, Math.min(1, t)); m = Math.min(m, Math.hypot(pt[0] - a[0] - t * dx, pt[1] - a[1] - t * dy)); } return m; };
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const step = Math.max(2, Math.min(x1 - x0, y1 - y0) / 40);
  let best = [(x0 + x1) / 2, (y0 + y1) / 2], bd = -1;
  for (let x = x0; x <= x1; x += step) for (let y = y0; y <= y1; y += step) { if (!d3.polygonContains(ring, [x, y])) continue; const d = dist([x, y]); if (d > bd) { bd = d; best = [x, y]; } }
  return { pt: best, rad: bd };
}

function drawWorld(cfg) {
  const MAXW = 998, MAXH = 900, pad = 8;
  const ids = new Set(cfg.items.map((i) => i.id));
  const feats = topojson.feature(worldTopo, worldTopo.objects.countries).features.filter((f) => f.properties.name !== "Antarctica");
  const isState = (f) => ids.has(f.id) && f.properties.name !== "Ashmore and Cartier Is.";
  const [[x0, y0], [x1, y1]] = cfg.box;
  const mp = { type: "MultiPoint", coordinates: [[x0, y0], [x1, y0], [x0, y1], [x1, y1]] };
  const proj = d3.geoNaturalEarth1().rotate([-(cfg.cx || 0), 0]);
  proj.fitExtent([[pad, pad], [MAXW - pad, MAXH - pad]], mp);
  let path = d3.geoPath(proj);
  const b = path.bounds(mp);
  const t = proj.translate(); proj.translate([t[0] + pad - b[0][0], t[1] + pad - b[0][1]]);
  path = d3.geoPath(proj);
  const W = Math.ceil(b[1][0] - b[0][0]) + 2 * pad, H = Math.ceil(b[1][1] - b[0][1]) + 2 * pad;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
  const ctx = d3.geoPath(proj, g);
  feats.filter((f) => !isState(f)).forEach((f) => { g.beginPath(); ctx(f); g.fillStyle = "#e9e9e9"; g.fill(); g.strokeStyle = "#bdbdbd"; g.lineWidth = 1; g.stroke(); });
  feats.filter(isState).forEach((f) => { g.beginPath(); ctx(f); g.fillStyle = "#fff"; g.fill(); g.strokeStyle = "#222"; g.lineWidth = 1.6; g.stroke(); });
  const byId = {}; feats.filter(isState).forEach((f) => { byId[f.id] = f; });
  const items = [];
  cfg.items.forEach((it) => {
    const f = byId[it.id]; if (!f) return;
    const polys = f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates;
    let bestPoly = null, ba = -1;
    polys.forEach((pc) => { const a = Math.abs(path.area({ type: "Polygon", coordinates: pc })); if (a > ba) { ba = a; bestPoly = pc; } });
    const ring = bestPoly[0].map((q) => proj(q)).filter(Boolean);
    if (ring.length < 4) return;
    const pole = poleOf(ring);
    if (pole.rad < 4.5) return; // příliš malý stát na označení
    const geo = proj.invert(pole.pt);
    items.push({ name: it.cs, ans: it.cap, h: null, r: pole.pt.map(Math.round), p: null, lat: geo ? geo[1] : 0 });
  });
  return { items, src: c.toDataURL("image/png"), W, H };
}

/* ===== Varianty ===== */
function makeVariants(T, P, { count, perTest, polabi, seed }) {
  const rnd = mulberry32(seed);
  const N = P.items.length;
  perTest = Math.min(perTest, N);
  const sep = T.sep || 0;
  const far = (chosen, i) => !sep || chosen.every((j) => Math.hypot(P.items[i].r[0] - P.items[j].r[0], P.items[i].r[1] - P.items[j].r[1]) >= sep);
  const variants = [];
  let pool = [];
  for (let v = 0; v < count; v++) {
    const chosen = [];
    const take = (list, relax) => {
      for (const i of list) { if (chosen.length >= perTest) break; if (chosen.includes(i)) continue; if (relax || far(chosen, i)) chosen.push(i); }
    };
    if (pool.length < perTest) pool = pool.concat(shuffle([...Array(N).keys()], rnd).filter((i) => !pool.includes(i)));
    take(pool, false);
    if (chosen.length < perTest) take(shuffle([...Array(N).keys()], rnd), false);
    if (chosen.length < perTest) take(shuffle([...Array(N).keys()], rnd), true);
    pool = pool.filter((i) => !chosen.includes(i));
    shuffle(chosen, rnd);
    const nums = shuffle([...Array(perTest)].map((_, i) => i + 1), rnd);
    const items = chosen.map((ri, k) => ({ letter: String.fromCharCode(65 + k), ri, num: nums[k] }));
    const others = [...Array(N).keys()].filter((i) => !chosen.includes(i));
    const vzor = others.length ? others[Math.floor(rnd() * others.length)] : null;
    const variant = { items, polabiLetter: polabi && T.extra ? String.fromCharCode(65 + perTest) : null, vzor };
    if (T.kind === "world") {
      let trio = null;
      for (let tries = 0; tries < 300 && !trio; tries++) {
        const s = shuffle([...items.keys()], rnd).slice(0, 3).map((k) => items[k].ri).sort((a, b) => P.items[b].lat - P.items[a].lat);
        if (P.items[s[0]].lat - P.items[s[1]].lat >= 6 && P.items[s[1]].lat - P.items[s[2]].lat >= 6) trio = s;
      }
      if (!trio) { const s = items.map((x) => x.ri).sort((a, b) => P.items[b].lat - P.items[a].lat); trio = [s[0], s[Math.floor(s.length / 2)], s[s.length - 1]]; }
      variant.trio = trio;                       // správné pořadí: sever → jih
      variant.trioShown = shuffle([...trio], rnd);
      if (variant.trioShown.join() === trio.join()) variant.trioShown.reverse();
    }
    variants.push(variant);
  }
  return variants;
}

function variantFacts(P, v) {
  const hs = v.items.map((it) => P.items[it.ri]);
  const hi = hs.reduce((a, b) => (b.h > a.h ? b : a));
  const lo = hs.reduce((a, b) => (b.h < a.h ? b : a));
  return { hi, lo, diff: hi.h - lo.h };
}
function vzorText(T, P, v) {
  if (T.kind === "world") {
    if (v.vzor == null) return "(vzor: stát – hlavní město)";
    const r = P.items[v.vzor]; return `(vzor: ${r.name} – ${r.ans})`;
  }
  if (v.vzor == null) return T.id === "kraje" ? "(vzor: název kraje – krajské město – 1 234 km²)" : "(vzor: název pohoří – nejvyšší hora – 1 234 m)";
  const r = P.items[v.vzor];
  return `(vzor: ${r.name} – ${r.ans} – ${fmtV(r.h, T.unit)})`;
}
const task4Text = (T, P, v) => T.kind === "world"
  ? `Seřaď tyto tři státy od nejseverněji po nejjižněji položený: ${v.trioShown.map((i) => P.items[i].name).join(", ")}.`
  : T.tasks[4];
const task1Text = (T, v) => T.tasks[v.polabiLetter ? 1.5 : 1];

/* ===== Word (.docx) – vyžaduje globální `docx` (docx@8.5.0) ===== */
function buildDocx(T, P, variants, opts, mapBuf, keyBufs) {
  const D = docx;
  const W = 9860; // šířka sazby v twipech (A4, okraje 1,8 cm)
  const none = { style: D.BorderStyle.NONE, size: 0, color: "FFFFFF" };
  const thin = { style: D.BorderStyle.SINGLE, size: 6, color: "000000" };
  const noBorders = { top: none, bottom: none, left: none, right: none, insideHorizontal: none, insideVertical: none };
  const allBorders = { top: thin, bottom: thin, left: thin, right: thin, insideHorizontal: thin, insideVertical: thin };

  const Pp = (children, o = {}) => new D.Paragraph({ children, spacing: { before: o.before ?? 0, after: o.after ?? 60 }, ...o.p });
  const Tt = (text, o = {}) => new D.TextRun({ text, ...o });

  const header = (idx, title, first) =>
    new D.Paragraph({
      pageBreakBefore: !first,
      tabStops: [{ type: D.TabStopType.RIGHT, position: W }],
      spacing: { after: 60 },
      children: [Tt(title, { bold: true, size: title.length > 40 ? 28 : 34 }), new D.TextRun({ children: [new D.Tab()] }), Tt(`Varianta ${idx}`, { bold: true, size: 26, color: "777777" })],
    });

  const spacer = (pts = 4) => new D.Paragraph({ spacing: { before: 0, after: 0, line: pts * 20, lineRule: D.LineRuleType.EXACT }, children: [] });

  const taskBox = (n, text) => [
    spacer(6),
    new D.Table({
      width: { size: W, type: D.WidthType.DXA },
      columnWidths: [W],
      borders: allBorders,
      rows: [new D.TableRow({ children: [new D.TableCell({
        width: { size: W, type: D.WidthType.DXA },
        shading: { type: D.ShadingType.CLEAR, color: "auto", fill: "FFF2CC" },
        margins: { top: 60, bottom: 60, left: 110, right: 110 },
        children: [Pp([Tt(`Úkol ${n}: `, { bold: true, size: 25 }), Tt(text, { size: 24 })], { after: 0 })],
      })] })],
    }),
    spacer(4),
  ];

  const letterTable = (v, answers) => {
    const n = v.items.length;
    const cw = Math.floor(W / n);
    const cell = (children, fill) => new D.TableCell({
      width: { size: cw, type: D.WidthType.DXA },
      verticalAlign: D.VerticalAlign.CENTER,
      shading: fill ? { type: D.ShadingType.CLEAR, color: "auto", fill } : undefined,
      children,
    });
    return new D.Table({
      width: { size: cw * n, type: D.WidthType.DXA },
      columnWidths: Array(n).fill(cw),
      alignment: D.AlignmentType.CENTER,
      borders: allBorders,
      rows: [
        new D.TableRow({ children: v.items.map((it) => cell([Pp([Tt(it.letter, { bold: true })], { after: 0, p: { alignment: D.AlignmentType.CENTER } })], "E8E8E8")) }),
        new D.TableRow({ height: { value: 620, rule: D.HeightRule.ATLEAST }, children: v.items.map((it) => cell([Pp(answers ? [Tt(String(it.num), { bold: true, color: "143CAA" })] : [], { after: 0, p: { alignment: D.AlignmentType.CENTER } })])) }),
      ],
    });
  };

  const listTable = (v) => {
    const left = v.items.map((it) => [it.letter, P.items[it.ri].name]);
    if (v.polabiLetter) left.push([v.polabiLetter, POLABI.name]);
    const right = v.items.map((it) => [String(it.num), P.items[it.ri].ans]).sort((a, b) => a[0] - b[0]);
    const rows = Math.max(left.length, right.length);
    const half = W / 2;
    const c = (pair) => new D.TableCell({
      width: { size: half, type: D.WidthType.DXA },
      children: [Pp(pair ? [Tt(pair[0] + " – ", { bold: true }), Tt(pair[1])] : [], { after: 20 })],
    });
    return new D.Table({
      width: { size: W, type: D.WidthType.DXA },
      columnWidths: [half, half],
      borders: noBorders,
      rows: [...Array(rows)].map((_, i) => new D.TableRow({ children: [c(left[i]), c(right[i])] })),
    });
  };

  const picture = (buf, cmWidth) => {
    // vysoké mapy zmenšíme, aby se vešly na stránku
    const maxH = 11.5;
    const cm = Math.min(cmWidth, (maxH * P.W) / P.H);
    const w = Math.round((cm / 2.54) * 96);
    return new D.Paragraph({
      alignment: D.AlignmentType.CENTER,
      spacing: { after: 60 },
      children: [new D.ImageRun({ data: buf, transformation: { width: w, height: Math.round((w * P.H) / P.W) } })],
    });
  };

  const children = [];
  let first = true;

  if (opts.tests) variants.forEach((v, i) => {
    const idx = i + 1;
    children.push(header(idx, T.title, first)); first = false;
    children.push(Pp([Tt("Jméno: ________________________________    Třída: ________    Datum: ____________")], { after: 100 }));
    children.push(...taskBox(1, task1Text(T, v)));
    children.push(picture(mapBuf.slice(0), 14.5));
    children.push(listTable(v));
    children.push(...taskBox(2, T.tasks[2]));
    children.push(letterTable(v, false));
    children.push(new D.Paragraph({ pageBreakBefore: true, children: [] }));
    children.push(...taskBox(3, T.tasks[3]));
    children.push(Pp([Tt(vzorText(T, P, v), { italics: true, color: "5A5A5A" })], { after: 160 }));
    v.items.forEach((it) => children.push(new D.Paragraph({
      tabStops: [{ type: D.TabStopType.RIGHT, position: W, leader: D.LeaderType.UNDERSCORE }],
      spacing: { before: 120, after: 240 },
      children: [Tt(P.items[it.ri].name + " "), new D.TextRun({ children: [new D.Tab()] })],
    })));
    children.push(...taskBox(4, task4Text(T, P, v)));
    if (T.kind === "world") {
      [1, 2, 3].forEach((n) => children.push(Pp([Tt(`${n}. ______________________________________`)], { before: 120, after: 160 })));
    } else {
      children.push(Pp([Tt(T.t4Lines[0])], { before: 120, after: 240 }));
      children.push(Pp([Tt("Výpočet: _____________________________________________________________")], { after: 240 }));
      children.push(Pp([Tt(`Rozdíl činí ____________ ${T.id === "kraje" ? "km²" : "metrů"}.`)], { after: 200 }));
    }
  });

  if (opts.key) variants.forEach((v, i) => {
    const idx = i + 1;
    children.push(header(idx, T.keyTitle, first)); first = false;
    children.push(...taskBox(1, task1Text(T, v)));
    children.push(picture(keyBufs[i], 13));
    children.push(Pp([Tt(T.legend(v), { italics: true, size: 19, color: "5A5A5A" })], { p: { alignment: D.AlignmentType.CENTER } }));
    children.push(...taskBox(2, T.tasks[2]));
    children.push(letterTable(v, true));
    children.push(...taskBox(3, T.tasks[3]));
    v.items.forEach((it) => {
      const r = P.items[it.ri];
      children.push(Pp([Tt(`${it.letter}   ${r.name} – `), Tt(T.kind === "world" ? r.ans : `${r.ans} – ${fmtV(r.h, T.unit)}`, { bold: true })], { after: 30 }));
    });
    children.push(...taskBox(4, task4Text(T, P, v)));
    if (T.kind === "world") {
      children.push(Pp([Tt("Správné pořadí: "), Tt(v.trio.map((k) => P.items[k].name).join("  →  "), { bold: true })]));
    } else {
      const f = variantFacts(P, v);
      children.push(Pp([Tt(`${f.hi.ans} (${fmtV(f.hi.h, T.unit)}) − ${f.lo.ans} (${fmtV(f.lo.h, T.unit)}) = `), Tt(`${fmtV(f.diff, T.unit)}`, { bold: true })]));
    }
  });

  return new D.Document({
    creator: "Generátor testů",
    title: T.title,
    styles: { default: { document: { run: { font: "Calibri", size: 23 } } } },
    sections: [{
      properties: { page: { size: { width: 11906, height: 16838 }, margin: { top: 900, bottom: 900, left: 1020, right: 1020 } } },
      children,
    }],
  });
}

if (typeof module !== "undefined") module.exports = { RANGES, KRAJE, POLABI, makeVariants, buildDocx, variantFacts, TOPICS };

const $ = (id) => document.getElementById(id);
const state = { seed: newSeed(), view: "test", topic: "pohori", P: null };
const curT = () => TOPICS[state.topic];
function newSeed() { return Math.floor(Math.random() * 9000) + 1000; }
function clampInput(el) {
  const v = Math.round(Number(el.value));
  const n = Math.min(Number(el.max), Math.max(Number(el.min), isFinite(v) ? v : Number(el.min)));
  el.value = n; return n;
}
function opts() {
  return { count: clampInput($("count")), perTest: clampInput($("per")), polabi: $("polabi").checked, seed: state.seed };
}
function setStatus(msg, err) { const s = $("status"); s.textContent = msg; s.classList.toggle("err", !!err); }

const pct = (x, y) => `left:${(x / state.P.W) * 100}%;top:${(y / state.P.H) * 100}%`;
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function render() {
  const T = curT(), P = state.P;
  const o = opts();
  const vs = makeVariants(T, P, o);
  const key = state.view === "key";
  $("seedInfo").textContent = `Sada č. ${state.seed}`;
  $("sumTitle").textContent = `Náhled · ${vs.length} ${vs.length === 1 ? "varianta" : vs.length < 5 ? "varianty" : "variant"}`;
  $("sheets").innerHTML = vs.map((v, i) => {
    const tags = key ? [
      ...v.items.map((it) => { const r = P.items[it.ri]; return `<span class="tag r" style="${pct(...r.r)}">${it.letter}</span>` + (r.p ? `<span class="tag p" style="${pct(...r.p)}">${it.num}</span>` : ""); }),
      v.polabiLetter ? `<span class="tag n" style="${pct(...POLABI.pos)}">${v.polabiLetter}</span>` : "",
    ].join("") : "";
    const left = v.items.map((it) => `<li><b>${it.letter}</b> ${esc(P.items[it.ri].name)}</li>`).join("") + (v.polabiLetter ? `<li><b>${v.polabiLetter}</b> ${POLABI.name}</li>` : "");
    const right = [...v.items].sort((a, b) => a.num - b.num).map((it) => `<li><b>${it.num}</b> ${esc(P.items[it.ri].ans)}</li>`).join("");
    const table = `<table class="grid-tbl"><tr>${v.items.map((it) => `<th>${it.letter}</th>`).join("")}</tr><tr>${v.items.map((it) => `<td>${key ? it.num : ""}</td>`).join("")}</tr></table>`;
    let answers = "";
    if (key) {
      const rows = v.items.map((it) => { const r = P.items[it.ri]; return `<div class="row"><span>${it.letter} ${esc(r.name)}</span><em>${esc(r.ans)}${T.kind === "world" ? "" : " – " + fmtV(r.h, T.unit)}</em></div>`; }).join("");
      let t4;
      if (T.kind === "world") t4 = `Úkol 4: <b>${v.trio.map((k) => esc(P.items[k].name)).join(" → ")}</b>`;
      else { const f = variantFacts(P, v); t4 = `Úkol 4: ${esc(f.hi.ans)} (${fmtV(f.hi.h, T.unit)}) − ${esc(f.lo.ans)} (${fmtV(f.lo.h, T.unit)}) = <b>${fmtV(f.diff, T.unit)}</b>`; }
      answers = `<div class="ans">${rows}</div><div class="diff">${t4}</div>`;
    }
    return `<article class="sheet" aria-label="Varianta ${i + 1}">
      <div class="sheet-head"><b>${esc(key ? T.keyTitle : T.title)}</b><span>Varianta ${i + 1}</span></div>
      <div class="map" style="aspect-ratio:${P.W} / ${P.H}"><img src="${P.src}" alt="Slepá mapa">${tags}</div>
      <div class="lists"><ol>${left}</ol><ol>${right}</ol></div>
      ${table}
      ${answers}
    </article>`;
  }).join("");
}

function loadMap(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
}
async function keyMapPng(T, P, img, v) {
  const c = document.createElement("canvas"); c.width = P.W; c.height = P.H;
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, P.W, P.H);
  g.drawImage(img, 0, 0, P.W, P.H);
  g.font = "bold 26px Arial, Helvetica, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  const lab = ([x, y], text, col) => {
    const w = g.measureText(text).width + 14, h = 32;
    g.fillStyle = "#fff"; g.strokeStyle = col; g.lineWidth = 3;
    g.beginPath(); if (g.roundRect) g.roundRect(x - w / 2, y - h / 2, w, h, 6); else g.rect(x - w / 2, y - h / 2, w, h);
    g.fill(); g.stroke(); g.fillStyle = col; g.fillText(text, x, y + 1);
  };
  if (v.polabiLetter) lab(POLABI.pos, v.polabiLetter, "#2f7a35");
  const letterCol = T.kind === "world" ? "#b3261e" : "#963c14";
  v.items.forEach((it) => { const r = P.items[it.ri]; lab(r.r, it.letter, letterCol); if (r.p) lab(r.p, String(it.num), "#143caa"); });
  const blob = await new Promise((res) => c.toBlob(res, "image/png"));
  return blob.arrayBuffer();
}

async function download() {
  const T = curT(), P = state.P;
  const btn = $("download");
  if (typeof docx === "undefined") { setStatus("Knihovnu pro vytvoření Wordu se nepodařilo načíst. Zkontrolujte připojení a obnovte stránku.", true); return; }
  btn.disabled = true; setStatus("Připravuji dokument…");
  try {
    const o = opts();
    const vs = makeVariants(T, P, o);
    const img = await loadMap(P.src);
    const mapBuf = Uint8Array.from(atob(P.src.split(",")[1]), (c) => c.charCodeAt(0)).buffer;
    const withKey = $("withKey").checked;
    const keyBufs = withKey ? await Promise.all(vs.map((v) => keyMapPng(T, P, img, v))) : [];
    const doc = buildDocx(T, P, vs, { tests: true, key: withKey }, mapBuf, keyBufs);
    const blob = await docx.Packer.toBlob(doc);
    const filename = `Test_${T.id}_${vs.length}_variant_sada_${state.seed}.docx`;
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    setStatus(`Staženo: ${filename}`);
  } catch (e) {
    setStatus("Dokument se nepodařilo vytvořit" + (e && e.message ? `: ${e.message}` : "."), true);
  } finally { btn.disabled = false; }
}

async function setTopic(id) {
  state.topic = id;
  const T = curT();
  $("topic").value = id;
  $("h1").textContent = "Generátor testů – " + T.label;
  $("lead").textContent = T.lead; $("note").textContent = T.note;
  $("perLabel").textContent = T.perLabel;
  $("polabiRow").style.display = T.extra ? "" : "none";
  $("download").disabled = true; setStatus(T.kind === "world" ? "Kreslím slepou mapu…" : "");
  $("sheets").innerHTML = "";
  try {
    state.P = await prepare(T);
  } catch (e) {
    setStatus((e && e.message) || "Mapu se nepodařilo načíst. Zkontrolujte připojení a zkuste to znovu.", true); return;
  }
  if (state.topic !== id) return;
  const per = $("per"); const max = Math.min(T.kind === "world" ? 12 : 13, state.P.items.length);
  per.max = max; per.min = Math.min(4, max);
  per.value = Math.min(T.perDef, max);
  $("download").disabled = false; setStatus("");
  render();
}

$("topic").innerHTML = Object.values(TOPICS).map((t) => `<option value="${t.id}">${esc(t.label)}</option>`).join("");
$("topic").addEventListener("change", () => { state.seed = newSeed(); setTopic($("topic").value); });
document.querySelectorAll("[data-step]").forEach((b) => b.addEventListener("click", () => {
  const [id, d] = b.dataset.step.split(":"); const el = $(id === "per" ? "per" : "count");
  el.value = Number(el.value) + Number(d); clampInput(el); if (state.P) render();
}));
["count", "per"].forEach((id) => $(id).addEventListener("change", () => state.P && render()));
$("polabi").addEventListener("change", () => state.P && render());
$("reroll").addEventListener("click", () => { if (!state.P) return; state.seed = newSeed(); render(); setStatus(`Nová sada č. ${state.seed}.`); });
$("download").addEventListener("click", download);
const setView = (v) => { state.view = v; $("viewTest").setAttribute("aria-pressed", v === "test"); $("viewKey").setAttribute("aria-pressed", v === "key"); if (state.P) render(); };
$("viewTest").addEventListener("click", () => setView("test"));
$("viewKey").addEventListener("click", () => setView("key"));
setTopic("pohori");
</script>
